[project]
name = "tr-ai-evals"
version = "0.1.0"
description = "Custom Turkish AI benchmarks and an interactive results explorer"
readme = "README.md"
authors = [
    { name = "okanyenigun", email = "okanyenigun@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "gradio[mcp,oauth]==6.29.1",
    "ipywidgets>=8.1.9",
    "langchain-core>=1.7.3",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "pandas>=3.0.6,<4",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
notebook = [
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.1",
]

[tool.ruff.lint]
ignore = [
    "BLE001",  # blind `except Exception` is intentional
    "I001",  # import sorting is not enforced
]
